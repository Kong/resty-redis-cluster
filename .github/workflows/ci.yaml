name: CI

on:
    push:
      branches: [ master ]
    pull_request:
      branches: [ master ]

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
              include:
                - version: 6.2.14
                  conf: no-auth
                  auth: "no"
                - version: 6.2.14
                  conf: auth
                  auth: "yes"
                - version: 7.2
                  conf: auth
                  auth: "yes"
                - version: 7.2
                  conf: no-auth
                  auth: "no"
                # A Redis 7 cluster that announces hostnames. The slot map then
                # carries an IP next to each hostname.
                - version: 7.2
                  conf: hostname
                  auth: "yes"
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v2.3.4

          - name: Install dependencies
            run: |
              sudo apt-get update
              sudo apt install -y cpanminus build-essential libncurses5-dev libreadline-dev libssl-dev perl lua5.1 liblua5.1-0-dev luarocks

          - name: Install Test::Nginx
            run: |
              sudo cpanm --notest Test::Nginx > build.log 2>&1 || (cat build.log && exit 1)

          - name: Install openresty
            run: |
              wget -qO - https://openresty.org/package/pubkey.gpg | sudo apt-key add -
              sudo apt-get -y install software-properties-common
              sudo add-apt-repository -y "deb http://openresty.org/package/ubuntu $(lsb_release -sc) main"
              sudo apt-get update
              sudo apt-get install -y openresty

          - name: Install lua-resty-openssl
            run: |
              sudo luarocks --lua-version 5.1 install lua-resty-openssl 1.8.0
              /usr/local/openresty/bin/resty -e 'require("resty.openssl.digest")'

          - name: Set up Redis Cluster
            run: |
              COMPOSE=t/redis_cluster/${{ matrix.version }}/${{ matrix.conf }}/docker-compose.yaml
              docker compose -f "$COMPOSE" up -d

              if [ "${{ matrix.auth }}" = "yes" ]; then
                REDIS_CLI="redis-cli -p 6371 --user kong --pass kong"
              else
                REDIS_CLI="redis-cli -p 6371"
              fi

              # The init container forms the cluster after the nodes start.
              for _ in $(seq 1 60); do
                if docker compose -f "$COMPOSE" exec -T redis_1 $REDIS_CLI cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
                  exit 0
                fi
                sleep 2
              done

              echo "the cluster did not become ready"
              docker compose -f "$COMPOSE" ps
              docker compose -f "$COMPOSE" logs --tail 50
              exit 1

          - name: Run tests
            run: |
              export REDIS_AUTH=${{ matrix.auth }}
              if [ "${{ matrix.version }}" = "7.2" ]; then
                # z-recover.t starts the 6.2 fixture itself. Run the other suites here.
                make test-redis7
              else
                make test
              fi
