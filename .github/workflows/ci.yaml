name: CI

on:
    push:
      branches: [ master ]
    pull_request:
      branches: [ master ]

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
              include:
                - version: 6.2.14
                  conf: no-auth
                - version: 6.2.14
                  conf: auth
                - version: 7.2
                  conf: auth
                - version: 7.2
                  conf: no-auth
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v2.3.4

          - name: Install dependencies
            run: |
              sudo apt-get update
              sudo apt install -y cpanminus build-essential libncurses5-dev libreadline-dev libssl-dev perl lua5.1 liblua5.1-0-dev luarocks

          - name: Install Test::Nginx
            run: |
              sudo cpanm --notest Test::Nginx > build.log 2>&1 || (cat build.log && exit 1)

          - name: Install openresty
            run: |
              wget -qO - https://openresty.org/package/pubkey.gpg | sudo apt-key add -
              sudo apt-get -y install software-properties-common
              sudo add-apt-repository -y "deb http://openresty.org/package/ubuntu $(lsb_release -sc) main"
              sudo apt-get update
              sudo apt-get install -y openresty

          - name: Install lua-resty-openssl
            run: |
              sudo luarocks --lua-version 5.1 install lua-resty-openssl 1.8.0
              /usr/local/openresty/bin/resty -e 'require("resty.openssl.digest")'

          - name: Set up Redis Cluster
            run: |
              docker compose -f t/redis_cluster/${{ matrix.version }}/${{ matrix.conf }}/docker-compose.yaml up -d
              sleep 30 # wait for redis cluster to be ready

          - name: Run tests
            run: |
              export REDIS_AUTH=$([[ "${{ matrix.conf }}" == "auth" ]] && echo "yes" || echo "no")
              if [ "${{ matrix.version }}" = "7.2" ]; then
                # z-recover.t starts the 6.2 fixture itself. Run the other suites here.
                prove t/auth_hook.t t/auth.t t/auth_rotation.t t/auth_pool_window.t \
                      t/redis7_with_host.t t/redirects.t t/closed.t t/cmd_master.t \
                      t/lock_scope.t t/pool_log.t t/sanity.t t/mock-redis-down.t \
                      t/version.t t/lock_timeout.t
              else
                make test
              fi
